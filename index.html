<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Step Integer Number Line Jump Visualizer</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #151d2a;
      --text: #f8fafc;
      --start-dot: #38bdf8;  /* Cyan for start */
      --result-text: #4ade80;/* Green for final result */
      --line: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0.5rem;
      overflow: hidden;
    }

    .container {
      background: var(--card);
      padding: 1.25rem 2rem;
      border-radius: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      width: 98vw;
      max-width: 1700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    h1 {
      text-align: center;
      margin: 0 0 0.75rem 0;
      color: #94a3b8;
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .btn-reset {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      background-color: #334155;
      color: #f8fafc;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    .btn-reset:hover {
      background-color: #f43f5e;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
    }

    .btn-reset:active {
      transform: scale(0.96);
    }

    .inputs {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.75rem;
      width: 100%;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      align-items: center;
    }

    label {
      font-size: 1.1rem;
      color: #cbd5e1;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      padding: 0.6rem 1rem;
      border-radius: 0.75rem;
      border: 3px solid #334155;
      background: #090d16;
      color: #fff;
      font-size: 2.2rem;
      font-weight: bold;
      width: 550px;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .equation {
      font-size: 3rem;
      text-align: center;
      font-weight: 800;
      margin: 0.25rem 0 0.5rem 0;
      min-height: 4.2rem;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 320px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 3rem;
      margin-top: 0.25rem;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="container">
    <button id="resetBtn" class="btn-reset" title="Clear input and start over">Reset</button>

    <h1>Integer Number Line Jump</h1>
    
    <div class="inputs">
      <div class="input-group">
        <label for="num1">Expression (e.g. -2+5-3--2+-8)</label>
        <input type="text" id="num1" placeholder="e.g. -2+5-3--2+-8" autocomplete="off" autofocus />
      </div>
    </div>

    <div class="equation" id="equation">Type an expression above</div>

    <div class="canvas-container">
      <svg id="numberLineSvg" viewBox="0 0 1400 320"></svg>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="dot" style="background: var(--start-dot)"></div>
        <span>Start Point</span>
      </div>
      <div class="legend-item">
        <div class="dot" style="background: var(--result-text)"></div>
        <span>Final Result</span>
      </div>
    </div>
  </div>

  <script>
    const input1 = document.getElementById('num1');
    const resetBtn = document.getElementById('resetBtn');

    // Distinct vibrant colors for successive jump arrows
    const jumpColors = [
      '#f43f5e', // Rose / Pink
      '#fbbf24', // Amber / Yellow
      '#a855f7', // Purple
      '#38bdf8', // Cyan
      '#fb923c', // Orange
      '#34d399', // Emerald
      '#e879f9', // Fuchsia
      '#f87171'  // Light Red
    ];

    input1.addEventListener('input', updateVisualizer);
    resetBtn.addEventListener('click', resetAll);

    input1.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        resetAll();
      }
    });

    function resetAll() {
      input1.value = '';
      input1.focus();
      updateVisualizer();
    }

    function parseMultiStepExpression(expr) {
      if (!expr) return { type: 'empty' };

      let cleaned = expr.replace(/\s+/g, '');

      const firstNumMatch = cleaned.match(/^[+-]?\d+/);
      if (!firstNumMatch) {
        if (/^[+-]?\d*$/.test(cleaned) && cleaned !== '' && cleaned !== '+' && cleaned !== '-') {
          return { type: 'partialStart', start: parseInt(cleaned, 10) };
        }
        return { type: 'invalid' };
      }

      let currentPos = firstNumMatch[0].length;
      let startVal = parseInt(firstNumMatch[0], 10);
      let steps = [];

      while (currentPos < cleaned.length) {
        const rest = cleaned.slice(currentPos);
        const stepMatch = rest.match(/^([+-]+)([+-]?\d+)/);
        if (!stepMatch) {
          return { 
            type: 'partial', 
            start: startVal, 
            steps, 
            trailing: rest 
          };
        }

        const opString = stepMatch[1];
        const numVal = parseInt(stepMatch[2], 10);

        let absVal = Math.abs(numVal);
        let minusCount = (opString.match(/-/g) || []).length;
        if (numVal < 0) minusCount++;

        let effectiveVal = minusCount % 2 === 1 ? -absVal : absVal;
        let displayOp = minusCount % 2 === 1 ? '-' : '+';

        steps.push({
          displayOp: displayOp,
          absVal: absVal,
          value: effectiveVal
        });

        currentPos += stepMatch[0].length;
      }

      return {
        type: 'full',
        start: startVal,
        steps: steps
      };
    }

    function updateVisualizer() {
      const rawText = input1.value.trim();
      const eqDiv = document.getElementById('equation');

      const parsed = parseMultiStepExpression(rawText);

      if (parsed.type === 'empty') {
        eqDiv.innerHTML = `<span style="color: #475569;">Type an expression (e.g. -2+5-3--2+-8)...</span>`;
        drawEmptyNumberLine(-10, 10);
        return;
      }

      if (parsed.type === 'invalid') {
        eqDiv.innerHTML = `<span style="color: #475569;">Invalid format (e.g. -2+5-3)</span>`;
        drawEmptyNumberLine(-10, 10);
        return;
      }

      if (parsed.type === 'partialStart') {
        eqDiv.innerHTML = `<span style="color: var(--start-dot)">${parsed.start}</span>`;
        drawJumps(parsed.start, []);
        return;
      }

      if (parsed.type === 'partial') {
        let html = `<span style="color: var(--start-dot)">${parsed.start}</span>`;
        parsed.steps.forEach((s, idx) => {
          let color = jumpColors[idx % jumpColors.length];
          html += ` <span style="color: #64748b">${s.displayOp}</span> <span style="color: ${color}">${s.absVal}</span>`;
        });
        if (parsed.trailing) {
          html += ` <span style="color: #64748b">${parsed.trailing}</span>`;
        }
        eqDiv.innerHTML = html;
        drawJumps(parsed.start, parsed.steps);
        return;
      }

      if (parsed.type === 'full') {
        let curr = parsed.start;
        let html = `<span style="color: var(--start-dot)">${parsed.start}</span>`;
        
        parsed.steps.forEach((s, idx) => {
          curr += s.value;
          let color = jumpColors[idx % jumpColors.length];
          html += ` <span style="color: #64748b">${s.displayOp}</span> <span style="color: ${color}">${s.absVal}</span>`;
        });

        html += ` = <span style="color: var(--result-text)">${curr}</span>`;
        eqDiv.innerHTML = html;

        drawJumps(parsed.start, parsed.steps);
      }
    }

    function drawEmptyNumberLine(minVal, maxVal) {
      const svg = document.getElementById('numberLineSvg');
      svg.innerHTML = '';
      
      const width = 1400;
      const padding = 100;
      const baselineY = 200;
      const getX = (val) => padding + ((val - minVal) / (maxVal - minVal)) * (width - 2 * padding);

      // Base Line
      svg.appendChild(createSvgElement('line', {
        x1: padding / 2, y1: baselineY,
        x2: width - padding / 2, y2: baselineY,
        stroke: '#475569', 'stroke-width': '7'
      }));

      // Ticks & Labels
      for (let i = minVal; i <= maxVal; i++) {
        const x = getX(i);
        const isZero = i === 0;

        svg.appendChild(createSvgElement('line', {
          x1: x, y1: baselineY - 18, x2: x, y2: baselineY + 18,
          stroke: isZero ? '#38bdf8' : '#64748b',
          'stroke-width': isZero ? '7' : '5'
        }));

        const text = createSvgElement('text', {
          x: x, y: baselineY + 75, 'text-anchor': 'middle',
          fill: isZero ? '#38bdf8' : '#ffffff',
          'font-size': '48', 'font-weight': 'bold'
        });
        text.textContent = i;
        svg.appendChild(text);
      }
    }

    function drawJumps(startVal, steps) {
      let points = [startVal];
      let curr = startVal;
      steps.forEach(s => {
        curr += s.value;
        points.push(curr);
      });

      let minVal = Math.min(...points) - 3;
      let maxVal = Math.max(...points) + 3;
      if (maxVal - minVal < 10) { minVal -= 2; maxVal += 2; }

      drawEmptyNumberLine(minVal, maxVal);

      const svg = document.getElementById('numberLineSvg');
      const padding = 100, width = 1400, baselineY = 200;
      const getX = (val) => padding + ((val - minVal) / (maxVal - minVal)) * (width - 2 * padding);

      const defs = createSvgElement('defs', {});
      let defsHtml = '';
      steps.forEach((s, idx) => {
        let color = jumpColors[idx % jumpColors.length];
        defsHtml += `
          <marker id="jumpArrow${idx}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="${color}" />
          </marker>
        `;
      });
      defs.innerHTML = defsHtml;
      svg.appendChild(defs);

      // Start Dot (Cyan)
      svg.appendChild(createSvgElement('circle', {
        cx: getX(startVal), cy: baselineY, r: '18',
        fill: '#38bdf8', stroke: '#090d16', 'stroke-width': '5'
      }));

      curr = startVal;
      steps.forEach((s, index) => {
        let nextVal = curr + s.value;
        let x1 = getX(curr);
        let x2 = getX(nextVal);
        let color = jumpColors[index % jumpColors.length];

        if (curr !== nextVal) {
          let midX = (x1 + x2) / 2;
          // Dynamic arc heights so successive/overlapping jumps stack nicely and remain clear
          let curveHeight = 85 + (index % 4) * 30;
          let controlY = baselineY - curveHeight;

          let path = createSvgElement('path', {
            d: `M ${x1} ${baselineY - 22} Q ${midX} ${controlY} ${x2} ${baselineY - 22}`,
            fill: 'none', stroke: color, 'stroke-width': '7',
            'marker-end': `url(#jumpArrow${index})`
          });
          svg.appendChild(path);
        }

        curr = nextVal;

        let isFinal = (index === steps.length - 1);
        svg.appendChild(createSvgElement('circle', {
          cx: x2, cy: baselineY, r: isFinal ? '18' : '14',
          fill: isFinal ? '#4ade80' : color,
          stroke: '#090d16', 'stroke-width': '4'
        }));
      });
    }

    function createSvgElement(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (let k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }

    // Initial render
    updateVisualizer();
  </script>
</body>
</html>
