<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Line Jump Visualizer</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #151d2a;
      --text: #f8fafc;
      --start-dot: #38bdf8;  /* High-contrast Cyan */
      --jump-arrow: #f43f5e; /* High-contrast Pink/Red */
      --result-text: #4ade80;/* High-contrast Green */
      --line: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0.5rem;
      overflow: hidden; /* Prevents scrollbars */
    }

    .container {
      background: var(--card);
      padding: 1.25rem 2rem;
      border-radius: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      width: 98vw;
      max-width: 1700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative; /* Enables absolute positioning for the Reset button */
    }

    h1 {
      text-align: center;
      margin: 0 0 0.75rem 0;
      color: #94a3b8;
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .btn-reset {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      background-color: #334155;
      color: #f8fafc;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    .btn-reset:hover {
      background-color: #f43f5e;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
    }

    .btn-reset:active {
      transform: scale(0.96);
    }

    .inputs {
      display: flex;
      gap: 3rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.75rem;
      width: 100%;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      align-items: center;
    }

    label {
      font-size: 1.1rem;
      color: #cbd5e1;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      padding: 0.6rem 1rem;
      border-radius: 0.75rem;
      border: 3px solid #334155;
      background: #090d16;
      color: #fff;
      font-size: 2.2rem;
      font-weight: bold;
      width: 240px;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .equation {
      font-size: 3.5rem;
      text-align: center;
      font-weight: 800;
      margin: 0.25rem 0 0.5rem 0;
      min-height: 4.2rem;
      letter-spacing: 0.02em;
    }

    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 320px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 3rem;
      margin-top: 0.25rem;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="container">
    <button id="resetBtn" class="btn-reset" title="Clear inputs and start over">Reset</button>

    <h1>Integer Number Line Jump</h1>
    
    <div class="inputs">
      <div class="input-group">
        <label for="num1">Start Position</label>
        <input type="text" id="num1" placeholder="Start" autocomplete="off" autofocus />
      </div>
      
      <div class="input-group">
        <label for="num2">Move / Jump</label>
        <input type="text" id="num2" placeholder="Jump" autocomplete="off" />
      </div>
    </div>

    <div class="equation" id="equation">Enter numbers above</div>

    <div class="canvas-container">
      <svg id="numberLineSvg" viewBox="0 0 1400 320"></svg>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="dot" style="background: var(--start-dot)"></div>
        <span>Start Point</span>
      </div>
      <div class="legend-item">
        <div class="dot" style="background: var(--jump-arrow)"></div>
        <span>Jump Arrow</span>
      </div>
    </div>
  </div>

  <script>
    const input1 = document.getElementById('num1');
    const input2 = document.getElementById('num2');
    const resetBtn = document.getElementById('resetBtn');

    input1.addEventListener('input', updateVisualizer);
    input2.addEventListener('input', updateVisualizer);
    resetBtn.addEventListener('click', resetAll);

    function resetAll() {
      input1.value = '';
      input2.value = '';
      input1.focus();
      updateVisualizer();
    }

    // Evaluates inputs with parentheses like -(-3), +(-5), -(-(-2)), etc.
    function parseIntegerExpr(expr) {
      if (!expr) return { valid: false, value: 0 };
      
      let cleaned = expr.replace(/\s+/g, '');
      if (cleaned === '' || cleaned === '-' || cleaned === '+') {
        return { valid: false, value: 0 };
      }

      let prev;
      do {
        prev = cleaned;
        cleaned = cleaned
          .replace(/\(-\+/g, '(-')
          .replace(/\(\+-/g, '(-')
          .replace(/\(--/g, '(')
          .replace(/\(\++/g, '(')
          .replace(/-\(/g, '-1*(')
          .replace(/\+\(/g, '+1*(')
          .replace(/--/g, '+')
          .replace(/\+\+/g, '+')
          .replace(/\+-/g, '-')
          .replace(/-\+/g, '-');
      } while (cleaned !== prev);

      cleaned = cleaned.replace(/\(([-+]?\d+)\)/g, '$1');

      try {
        if (!/^[0-9+\-*()]+$/.test(cleaned)) {
          return { valid: false, value: 0 };
        }
        const parsed = Function(`'use strict'; return (${cleaned})`)();
        return {
          valid: typeof parsed === 'number' && !isNaN(parsed) && Number.isInteger(parsed),
          value: parsed
        };
      } catch (e) {
        return { valid: false, value: 0 };
      }
    }

    function updateVisualizer() {
      const raw1 = input1.value.trim();
      const raw2 = input2.value.trim();

      const startRes = parseIntegerExpr(raw1);
      const jumpRes = parseIntegerExpr(raw2);

      const eqDiv = document.getElementById('equation');

      // Empty Box 1 -> Blank canvas state
      if (!startRes.valid) {
        eqDiv.innerHTML = `<span style="color: #475569;">Type a start number...</span>`;
        drawEmptyNumberLine(-10, 10);
        return;
      }

      const startVal = startRes.value;

      // Empty Box 2 -> Show only start dot
      if (!jumpRes.valid) {
        eqDiv.innerHTML = `<span style="color: var(--start-dot)">${startVal}</span>`;
        drawStartOnly(startVal);
        return;
      }

      const jumpVal = jumpRes.value;
      const endVal = startVal + jumpVal;

      // Equation text formatting
      let opSign = jumpVal >= 0 ? '+' : '-';
      let absJump = Math.abs(jumpVal);
      eqDiv.innerHTML = 
        `<span style="color: var(--start-dot)">${startVal}</span> ` +
        `<span style="color: #94a3b8">${opSign}</span> ` +
        `<span style="color: var(--jump-arrow)">${absJump}</span> = ` +
        `<span style="color: var(--result-text)">${endVal}</span>`;

      drawJump(startVal, endVal);
    }

    function drawEmptyNumberLine(minVal, maxVal) {
      const svg = document.getElementById('numberLineSvg');
      svg.innerHTML = '';
      
      const width = 1400;
      const padding = 100;
      const baselineY = 200;
      const getX = (val) => padding + ((val - minVal) / (maxVal - minVal)) * (width - 2 * padding);

      // Thick Base Line
      svg.appendChild(createSvgElement('line', {
        x1: padding / 2, y1: baselineY,
        x2: width - padding / 2, y2: baselineY,
        stroke: '#475569', 'stroke-width': '7'
      }));

      // Ticks & GIANT 48px Labels
      for (let i = minVal; i <= maxVal; i++) {
        const x = getX(i);
        const isZero = i === 0;

        // Taller tick marks
        svg.appendChild(createSvgElement('line', {
          x1: x, y1: baselineY - 18, x2: x, y2: baselineY + 18,
          stroke: isZero ? '#38bdf8' : '#64748b',
          'stroke-width': isZero ? '7' : '5'
        }));

        // Numbers at 48px font size
        const text = createSvgElement('text', {
          x: x, y: baselineY + 75, 'text-anchor': 'middle',
          fill: isZero ? '#38bdf8' : '#ffffff',
          'font-size': '48', 'font-weight': 'bold'
        });
        text.textContent = i;
        svg.appendChild(text);
      }
    }

    function drawStartOnly(startVal) {
      let minVal = Math.min(0, startVal) - 3;
      let maxVal = Math.max(0, startVal) + 3;
      if (maxVal - minVal < 10) { minVal -= 2; maxVal += 2; }

      drawEmptyNumberLine(minVal, maxVal);

      const svg = document.getElementById('numberLineSvg');
      const padding = 100, width = 1400, baselineY = 200;
      const getX = (val) => padding + ((val - minVal) / (maxVal - minVal)) * (width - 2 * padding);

      // Large Start Dot
      svg.appendChild(createSvgElement('circle', {
        cx: getX(startVal), cy: baselineY, r: '18',
        fill: '#38bdf8', stroke: '#090d16', 'stroke-width': '5'
      }));
    }

    function drawJump(startVal, endVal) {
      const values = [0, startVal, endVal];
      let minVal = Math.min(...values) - 3;
      let maxVal = Math.max(...values) + 3;
      if (maxVal - minVal < 10) { minVal -= 2; maxVal += 2; }

      drawEmptyNumberLine(minVal, maxVal);

      const svg = document.getElementById('numberLineSvg');
      const padding = 100, width = 1400, baselineY = 200;
      const getX = (val) => padding + ((val - minVal) / (maxVal - minVal)) * (width - 2 * padding);

      // Arrowhead Marker (Scaled down for proportional sizing)
      const defs = createSvgElement('defs', {});
      defs.innerHTML = `
        <marker id="jumpArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
        </marker>
      `;
      svg.appendChild(defs);

      const x1 = getX(startVal);
      const x2 = getX(endVal);

      // Start Dot
      svg.appendChild(createSvgElement('circle', {
        cx: x1, cy: baselineY, r: '18',
        fill: '#38bdf8', stroke: '#090d16', 'stroke-width': '5'
      }));

      // Curved Jump Arrow
      if (startVal !== endVal) {
        const midX = (x1 + x2) / 2;
        const curveHeight = 110;
        const controlY = baselineY - curveHeight;

        const path = createSvgElement('path', {
          d: `M ${x1} ${baselineY - 22} Q ${midX} ${controlY} ${x2} ${baselineY - 22}`,
          fill: 'none', stroke: '#f43f5e', 'stroke-width': '8',
          'marker-end': 'url(#jumpArrow)'
        });
        svg.appendChild(path);

        // End Dot
        svg.appendChild(createSvgElement('circle', {
          cx: x2, cy: baselineY, r: '16',
          fill: '#4ade80', stroke: '#090d16', 'stroke-width': '4'
        }));
      }
    }

    function createSvgElement(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (let k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }

    // Initial render
    updateVisualizer();
  </script>
</body>
</html>
